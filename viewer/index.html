<div id="loader" class="mono"><video id="optic" src="../assets/screen.mp4" muted playsinline autoplay preload="auto"></video><b>MINIDECK</b><span id="loadpct">0%</span></div>

<div id="tip" class="mono"></div>

<div id="pick" class="mono" hidden>
  <p class="kicker">// selected</p><h3 id="pickName"></h3><p id="pickInfo"></p>
  <div class="row"><button id="pickSolo">solo</button><button id="pickHide">hide</button><button id="pickX" aria-label="Clear selection">×</button></div>
</div>

<aside id="side" class="mono">
  <div class="sec">
    <p class="kicker">// colourway</p>
    <div id="swatches"></div><p id="palName" class="dim"></p>
  </div>
  <div class="sec sliders">
    <label><span>lid</span><input id="lid" type="range" min="0" max="180" step="1" value="110"><b id="lidOut">110°</b></label>
    <label><span>explode</span><input id="explode" type="range" min="0" max="100" step="1" value="0"><b id="explodeOut">0%</b></label>
    <div class="toggles"><button id="xray">x-ray case</button><button id="spin">auto-spin</button><button id="resetBtn">reset view</button></div>
    <button id="arBtn" class="arbtn">view in AR · real size</button>
  </div>
  <div class="sec parts">
    <div class="ps-head"><p class="kicker">// visible parts <b id="partsCount"></b></p></div>
    <div class="ps-presets"><button data-p="all">all</button><button data-p="elec">electronics</button><button data-p="case">case</button><button data-p="none">none</button></div>
    <div class="ps-list"></div>
  </div>
  <p class="hint dim">drag to orbit · scroll / pinch to zoom · right-drag / two fingers to pan · click a part</p>
</aside>
<button id="sideBtn" class="mono">controls</button>
<button id="arBtnM" class="mono">AR</button>

<div id="arUI" class="mono" hidden>
  <div class="ar-top"><span id="arMsg"></span><button id="arExit" aria-label="Exit AR">exit</button></div>
  <div class="ar-bar"><span>lid</span><input id="arLid" type="range" min="0" max="180" value="110"><b id="arLidOut">110°</b></div>
</div>
<div id="arModal" class="mono" hidden>
  <div class="box"><p class="kicker">// view in AR</p><p id="arNote"></p><div id="arQR"></div><button id="arClose">close</button></div>
</div>
